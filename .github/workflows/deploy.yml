name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Write .env from GitHub Secrets
      - name: Create .env from secrets
        run: |
          cat <<EOF > .env
          GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}
          SAC_ADDRESS=${{ secrets.SAC_ADDRESS }}
          SC_ADDRESS=${{ secrets.SC_ADDRESS }}
          HB_TOKEN=${{ secrets.HB_TOKEN }}
          HB_SAC_UUID=${{ secrets.HB_SAC_UUID }}
          HB_SC_UUID=${{ secrets.HB_SC_UUID }}
          ZOHO_API_URL=${{ secrets.ZOHO_API_URL }}
          ZOHO_API_TOKEN=${{ secrets.ZOHO_API_TOKEN }}
          EOF

      - name: Build index.html
        run: node build.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .   # serves index.html from repo root

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
